name: CI

on:
  push:
    branches: [main, frontend, backend]
  pull_request:
    branches: [main, frontend, backend]

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Bundling the web target catches broken imports, missing modules and
      # invalid routes — the failures a typecheck alone will not surface.
      - name: Build web bundle
        run: npm run build:web

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 7

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the dev server
        run: |
          npm run web &
          npx wait-on http://localhost:8081 --timeout 180000

      - name: Run the smoke test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          retention-days: 7
