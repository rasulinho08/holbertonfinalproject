  <style>
    :root {
      --ink: #142a4a;
      --blue: #3478ea;
      --mist: #eaf4ff;
      --line: #dbeafe;
    }

    * { box-sizing: border-box; }

    body {
      width: 100%;
      margin: 0;
      overflow-x: hidden;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
    }

    .app-wrapper {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      overflow: hidden;
      position: relative;
    }

    .display-face { font-family: "Fraunces", Georgia, serif; }

    .visual-side {
      position: relative;
      min-height: 600px;
      overflow: hidden;
      isolation: isolate;
    }

    .visual-side::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 17%, rgba(104, 177, 255, .34), transparent 24rem),
        radial-gradient(circle at 84% 79%, rgba(195, 226, 255, .82), transparent 24rem),
        linear-gradient(145deg, #fafdff 0%, #eff7ff 57%, #e0efff 100%);
      z-index: -4;
    }

    .visual-side::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .52;
      background-image: radial-gradient(rgba(43, 111, 190, .15) .7px, transparent .7px);
      background-size: 18px 18px;
      mask-image: linear-gradient(135deg, black, transparent 73%);
      z-index: -3;
    }

    .orb {
      position: absolute;
      border-radius: 999px;
      filter: blur(10px);
      pointer-events: none;
    }

    .orb-one {
      width: 270px;
      height: 270px;
      top: -100px;
      right: -80px;
      background: rgba(146, 204, 255, .48);
    }

    .orb-two {
      width: 210px;
      height: 210px;
      bottom: -75px;
      left: -75px;
      background: rgba(107, 166, 247, .23);
    }

    .wave {
      position: absolute;
      width: 138%;
      height: 260px;
      border: 1px solid rgba(72, 145, 228, .22);
      border-radius: 50%;
      pointer-events: none;
      transform: rotate(-23deg);
    }

    .wave-a { top: 3%; left: -38%; }
    .wave-b { bottom: 6%; left: -16%; transform: rotate(18deg); }
    .wave-c { bottom: 31%; right: -72%; transform: rotate(79deg); }

    .particle {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(77, 149, 235, .56);
      box-shadow: 0 0 15px rgba(73, 147, 238, .62);
      animation: particleFloat 7s ease-in-out infinite;
      pointer-events: none;
    }

    .particle:nth-of-type(1) { top: 12%; left: 16%; animation-delay: -1s; }
    .particle:nth-of-type(2) { top: 24%; right: 18%; width: 4px; height: 4px; animation-delay: -4s; }
    .particle:nth-of-type(3) { bottom: 22%; left: 35%; width: 5px; height: 5px; animation-delay: -2s; }
    .particle:nth-of-type(4) { bottom: 10%; right: 12%; width: 8px; height: 8px; animation-delay: -5s; }

    .book-scene {
      position: relative;
      width: min(100%, 650px);
      height: 560px;
      margin: 0 auto;
    }

    .book-object {
      position: absolute;
      width: 150px;
      aspect-ratio: .66;
      transform-style: preserve-3d;
      animation: bookFloat 7.5s ease-in-out infinite;
      filter: drop-shadow(0 24px 20px rgba(18, 72, 137, .2));
    }

    .book-object::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: 5px;
      bottom: 5px;
      left: -12px;
      width: 13px;
      border-radius: 5px 0 0 5px;
      background: linear-gradient(90deg, #7393bd, #dcecff 65%, #90aeca);
      transform: skewY(-6deg);
      box-shadow: inset -2px 0 rgba(20, 55, 94, .16);
    }

    .book-object::after {
      content: "";
      position: absolute;
      inset: 7px -7px -7px 7px;
      z-index: -2;
      border-radius: 5px;
      background: rgba(27, 74, 128, .21);
      filter: blur(6px);
      transform: translateZ(-1px);
    }

    .book-cover {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: 5px 12px 12px 5px;
      background: #213f69;
      box-shadow:
        inset 8px 0 12px rgba(255,255,255,.13),
        inset -8px 0 13px rgba(1,23,54,.18),
        0 0 0 1px rgba(38, 105, 181, .1);
    }

    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .78;
      mix-blend-mode: luminosity;
      transform: scale(1.09);
    }

    .cover-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(155deg, rgba(255,255,255,.11), transparent 34%, rgba(0,31,71,.42));

    .cover-copy {

      flex-direction: column;

      padding: 14px 12px 15px;
      color: white;

    .book-kicker {

    .book-sherlock .book-cover { background: #0b3b67; }

    .panel-side {

    }

    .auth-card {

    }

    .auth-card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      top: -118px;
      right: -100px;
      border-radius: 50%;
      background: rgba(194, 226, 255, .52);
      filter: blur(8px);
    }

    .brand-mark {
      width: 42px;

    }

    .email-control {
      border: 1px solid #cfdef1;
      background: rgba(248, 252, 255, .88);
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .email-control:focus {
      outline: none;
      border-color: #4b8cf0;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(74, 145, 244, .13);
    }

    .primary-action {
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
      box-shadow: 0 12px 22px rgba(38, 107, 211, .22);
    }

    .primary-action:hover { transform: translateY(-2px); filter: brightness(1.03); }
    .primary-action:active { transform: translateY(0); }

    .reveal {
      opacity: 0;
      transform: translateY(14px);
      animation: reveal .75s cubic-bezier(.22, 1, .36, 1) forwards;
    }

    .reveal-delay-1 { animation-delay: .1s; }
    .reveal-delay-2 { animation-delay: .2s; }
    .reveal-delay-3 { animation-delay: .3s; }

    .status-message { min-height: 22px; }

    @keyframes bookFloat {
      0%, 100% { margin-top: 0; }
      50% { margin-top: -13px; }
    }

    @keyframes particleFloat {
      0%, 100% { transform: translate(0, 0); opacity: .55; }
      50% { transform: translate(9px, -19px); opacity: 1; }
    }

    @keyframes reveal {
      to { opacity: 1; transform: translateY(0); }
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #97c2ff;
      outline-offset: 3px;
    }

    @media (max-width: 1023px) {
      .visual-side { min-height: 520px; }
      .book-scene { transform: scale(.88); transform-origin: center bottom; margin-top: -30px; margin-bottom: -25px; }
    }

    @media (max-width: 560px) {
      .visual-side { min-height: 445px; }
      .book-scene { transform: scale(.67); transform-origin: center bottom; margin-top: -85px; margin-bottom: -80px; }
      .book-object { filter: drop-shadow(0 18px 15px rgba(18,72,137,.18)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .book-object, .particle, .reveal { animation: none; }
      .reveal { opacity: 1; transform: none; }
      .primary-action { transition: none; }
    }

  <script src="/_sdk/a051f9537983733d.editing_sdk.js" integrity="sha512-IWn3eBHnVt7zQ0Rp79J72qSgJoLbskCA9lcfY4retf+5km4LjuhSHpvx+182KCHmEZ6EbJtWqVsybpV8Sd8PQQ=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const form = document.getElementById("email-form");
      const email = document.getElementById("reader-email");
      const status = document.getElementById("email-status");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const value = email.value.trim();

        if (!value || !email.validity.valid) {
          status.textContent = "Please enter a valid email address.";
          status.className = "status-message mt-4 text-center text-sm font-medium text-rose-600";
          email.focus();
          return;
        }

        status.textContent = "Your email is ready for the next step in KitabDostu."
        status.className = "status-message mt-4 text-center text-sm font-medium text-blue-700";
      });

      email.addEventListener("input", () => {
        if (status.textContent) {
          status.textContent = "";
          status.className = "status-message mt-4 text-center text-sm font-medium";
        }
      });
    });
  </script>
